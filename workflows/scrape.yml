name: BD Govt Job Notifier

on:
  schedule:
    # প্রতি ৪ ঘন্টা পরপর (UTC সময়ে) — 00:00, 04:00, 08:00, 12:00, 16:00, 20:00
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # ম্যানুয়ালি Run করার সুবিধার জন্য

permissions:
  contents: write # sent.json কমিট করার জন্য দরকার

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: রিপো চেকআউট করা
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: প্যাকেজ ইনস্টল
        run: npm install

      - name: স্ক্র্যাপ ও নোটিফাই
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node scrape.js

      - name: পাঠানো পোস্টের তালিকা (sent.json) কমিট করা
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent.json || true
          git diff --cached --quiet || git commit -m "chore: update sent.json [skip ci]"
          git push || true
